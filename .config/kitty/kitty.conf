font_family      JetBrains Mono
font_size        12.0
bold_font        auto
italic_font      auto
bold_italic_font auto

background_opacity 0.95
background #1e1e2e

foreground #cdd6f4
cursor      #f5e0dc
cursor_text #1e1e2e

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

window_padding_width 8
hide_window_decorations yes
confirm_os_window_close 0
single_window padding

cursor_shape beam
cursor_blink_interval 0

scrollback_lines 10000

mouse_hide_wait 3.0

allow_hyperlinks yes
allow_remote_control yes

listen_on unix:@kitty-$INSTANCE

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+enter launch --location=hsplit --cwd=current
map ctrl+shift+up    resize_window taller 3
map ctrl+shift+down  resize_window shorter 3
map ctrl+shift+left  resize_window narrower 3
map ctrl+shift+right resize_window wider  3