;==========================================================
;
;   Polybar config — CachyOS professional setup
;   North / left:   i3 workspaces
;   Center:         time & date
;   South / right:  system tray + volume (mouse-wheel)
;
;   Filter to refresh:  <global/wm> window (i3 is enough)
;
;==========================================================

[colors]
background = #2E3440
background-alt = #3B4252
foreground = #D8DEE9
foreground-alt = #ECEFF4
primary = #88C0D0
secondary = #81A1C1
alert = #BF616A
disabled = #4C566A

[bar/cachyos]
monitor = ${env:MONITOR:DP-0}
width = 100%
height = 26
radius = 0
fixed-center = true
top = true
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 1
line-color = ${colors.disabled}

border-top-size = 0
border-bottom-size = 0
border-left-size = 0
border-right-size = 0

padding-left = 1
padding-right = 1

module-margin-left = 1
module-margin-right = 1

font-0 = "MesloLGM Nerd Font Mono:pixelsize=11;1"
font-1 = "MesloLGM Nerd Font:pixelsize=11;3"

modules-left = i3
modules-center = date
modules-right = ram sep volume sep power tray

;------------------------------------------------------------------
; MODULES
;------------------------------------------------------------------

[module/i3]
type = internal/i3
; width should not exceed the prefix/suffix size
index-sort = true
wrapping-scroll = true
strip-wsnumbers = false
; show workspace numbers
format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 2
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.primary}

label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-padding = 3
label-focused-underline = ${colors.primary}

label-unfocused = %index%
label-unfocused-background = ${colors.background-alt}
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-padding = 3
label-unfocused-underline = ${colors.background-alt}

label-visible = %index%
label-visible-background = ${colors.background-alt}
label-visible-foreground = ${colors.primary}
label-visible-padding = 3
label-visible-underline = ${colors.primary}

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 3

label-separator = 
label-separator-padding = 1

[module/ram]
type = custom/script
exec = free -b | awk '/^Mem:/ {printf "%.1fGB\\n", $7/1073741824}'
interval = 5
label = " %output%"
label-foreground = ${colors.foreground-alt}

[module/sep]
type = custom/text
format = "|"
format-foreground = ${colors.disabled}

[module/date]
type = internal/date
interval = 1
date = "%a %d %b %H:%M"
label = %date%
label-foreground = ${colors.foreground-alt}
format-prefix = "  "
format-prefix-foreground = ${colors.disabled}
format-foreground = ${colors.foreground-alt}
click-left = xdg-open "https://calendar.google.com"

[module/power]
type = custom/script
exec = echo ""
label = %output%
label-foreground = ${colors.foreground-alt}
format-foreground = ${colors.foreground-alt}
click-left = ~/.config/polybar/scripts/power.sh

[module/tray]
type = internal/tray
tray-position = right
tray-offset-x = -2
tray-padding = 1
tray-maxsize = 16
tray-background = ${colors.background}
tray-foreground = ${colors.foreground}

[module/volume]
type = custom/script
exec = ~/.config/polybar/scripts/volume.sh
interval = 1
label = %output%
label-foreground = ${colors.foreground-alt}
format-foreground = ${colors.foreground-alt}

; mouse-wheel / clicks change volume via pamixer (same backend as i3 keys)
scroll-up = ~/.config/polybar/scripts/volume.sh --inc 5
scroll-down = ~/.config/polybar/scripts/volume.sh --dec 5
click-left = ~/.config/polybar/scripts/volume.sh --inc 5
click-middle = ~/.config/polybar/scripts/volume.sh --mute
click-right = ~/.config/polybar/scripts/volume.sh --mute

;------------------------------------------------------------------
[settings]
screenchange-reload = true
compositing-background = over
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

[global/wm]
margin-top = 0
margin-bottom = 0
