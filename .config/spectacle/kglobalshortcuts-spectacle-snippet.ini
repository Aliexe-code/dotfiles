# Spectacle Print-key settings — reference snapshot 2026-09-22
# Target section: org.kde.spectacle.desktop under [services] in kglobalshortcutsrc
# (Plasma sessions only).
# On i3, the Print key is bound in i3/config instead, see dotfiles i3 config:
#   bindsym Print exec spectacle -r
#   bindsym Shift+Print exec spectacle -f
#   bindsym mod+Print exec spectacle -a

[services][org.kde.spectacle.desktop]
ActiveWindowScreenShot=Alt+Print,Meta+Print,Capture Active Window
CurrentMonitorScreenShot=none,none,Capture Current Monitor
FullScreenScreenShot=Shift+Print,Shift+Print,Capture Entire Desktop
OpenWithoutScreenshot=none,none,Launch without taking a screenshot
RectangularRegionScreenShot=Print,Meta+Shift+Print,Capture Rectangular Region
WindowUnderCursorScreenShot=Meta+Ctrl+Print,Meta+Ctrl+Print,Capture Window Under Cursor
_launch=none
_k_friendly_name=Spectacle
